---
layout: default
---
<article class="wrap narrow prose">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%d %B %Y' }}</time>
      {% if page.tags.size > 0 %} · {{ page.tags | join: ', ' }}{% endif %}
    </p>
  </header>
  {{ content }}
  <p class="back"><a href="{{ '/' | relative_url }}">&larr; Home</a></p>
</article>

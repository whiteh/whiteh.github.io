# Site
title: forkthis
tagline: "Mark Greenwood"
description: >-
  Mark Greenwood, a developer working across streamed data, machine learning,
  web applications and application security. Projects and notes.
url: "https://forkthis.co.uk"
author:
  name: Mark Greenwood
avatar: https://en.gravatar.com/userimage/110637740/2562b2dfcd0050f6cb9e7511f655ebdc.jpg

# Navigation (in order)
nav:
  - title: Projects
    url: /#projects
  - title: About
    url: /about/

# Collections
collections:
  portfolio:
    output: true
    permalink: /projects/:name/

defaults:
  - scope: { type: portfolio }
    values: { layout: project }
  - scope: { type: posts }
    values: { layout: post }

# Build
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
sass:
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-redirect-from
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - docker-compose.yml
  - vendor
